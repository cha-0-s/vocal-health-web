<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Melly's Science Revision 🔬</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap');
:root{--bg:#fff9f0;--yellow:#FFD166;--pink:#FF8FAB;--lav:#C77DFF;--mint:#6BCB77;--peach:#FF9F6B;--blue:#4ECDC4;--red:#FF6B6B;--card:#fff;--shadow:rgba(0,0,0,0.08);--text:#3d3d3d;--muted:#888;--border:#f0e8d8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#app{max-width:430px;margin:0 auto;min-height:100vh}
.screen{display:none;min-height:100vh;padding-bottom:80px}
.screen.active{display:block}

/* HEADER */
.hdr{background:var(--card);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px var(--shadow);position:sticky;top:0;z-index:100}
.hdr-title{font-family:'Fredoka One',cursive;font-size:1.1rem;flex:1;text-align:center}
.back{background:none;border:none;font-size:1.4rem;cursor:pointer;padding:4px 8px;color:var(--text);border-radius:8px;min-width:40px}
.hdr-right{min-width:40px;text-align:right;font-size:0.8rem;font-weight:700;color:var(--mint)}

/* CARDS */
.card{background:var(--card);border-radius:16px;padding:16px;margin:0 16px 12px;box-shadow:0 2px 8px var(--shadow)}
.sec-title{font-family:'Fredoka One',cursive;font-size:0.95rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:16px 16px 6px}

/* PROGRESS */
.pb-wrap{background:#f0e8d8;border-radius:99px;height:8px;overflow:hidden}
.pb-fill{height:100%;border-radius:99px;background:linear-gradient(to right,var(--mint),var(--blue));transition:width .4s}
.pb-label{font-size:.78rem;color:var(--muted);font-weight:600;margin-top:4px}

/* COUNTDOWN */
.countdown{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:16px;padding:18px 16px;margin:12px 16px;text-align:center}
.cd-days{font-family:'Fredoka One',cursive;font-size:3rem;line-height:1}
.cd-lbl{font-size:.85rem;opacity:.88;margin-top:4px}
.cd-date{font-size:.75rem;opacity:.7;margin-top:2px}

/* HOME */
.home-top{padding:16px 16px 4px}
.home-title{font-family:'Fredoka One',cursive;font-size:1.7rem}
.home-sub{font-size:.85rem;color:var(--muted);margin-top:2px}
.overall-stats{display:flex;justify-content:space-around;margin-top:12px}
.stat-num{font-family:'Fredoka One',cursive;font-size:1.6rem;text-align:center}
.stat-lbl{font-size:.7rem;color:var(--muted);font-weight:600;text-align:center}

/* GROUP CARDS */
.g-card{margin:0 16px 12px;border-radius:16px;padding:16px;cursor:pointer;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:transform .15s}
.g-card:active{transform:scale(.98)}
.g-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.g-icon{font-size:1.8rem}
.g-name{font-family:'Fredoka One',cursive;font-size:1.1rem}
.g-count{font-size:.8rem;opacity:.85}
.g-arrow{margin-left:auto;font-size:1.3rem;opacity:.8}
.g-card .pb-wrap{background:rgba(255,255,255,.3)}
.g-card .pb-fill{background:rgba(255,255,255,.9)}
.g-card .pb-label{color:rgba(255,255,255,.85)}

/* TOPIC LIST */
.t-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer}
.t-row:last-child{border-bottom:none}
.t-row:active{opacity:.7}
.t-icon{font-size:1.4rem;width:36px;text-align:center;flex-shrink:0}
.t-info{flex:1}
.t-name{font-weight:700;font-size:.95rem}
.t-status{font-size:.75rem;font-weight:600;margin-top:2px}
.t-arr{color:var(--muted)}

/* STEP INDICATOR */
.steps{display:flex;align-items:center;padding:10px 16px;gap:4px}
.step{flex:1;text-align:center;font-size:.78rem;font-weight:700;padding:8px 4px;border-radius:8px;color:var(--muted);background:#f0e8d8}
.step.active{background:var(--yellow);color:var(--text)}
.step.done{background:var(--mint);color:#fff}
.step-sep{color:var(--muted);font-size:1rem}

/* NOTES */
.notes-wrap{padding:4px 16px 100px}
.n-h3{font-family:'Fredoka One',cursive;font-size:1.05rem;margin:18px 0 8px;color:var(--text)}
.n-p{font-size:.88rem;line-height:1.65;margin-bottom:8px}
.key-box{background:#fff8e1;border-left:4px solid var(--yellow);border-radius:0 8px 8px 0;padding:12px 14px;font-size:.87rem;line-height:1.55;margin:10px 0}
.formula-box{background:#e8f4fd;border:2px solid var(--blue);border-radius:12px;padding:16px;margin:12px 0;text-align:center}
.f-title{font-size:.72rem;font-weight:700;color:var(--blue);text-transform:uppercase;margin-bottom:6px;letter-spacing:.05em}
.f-eq{font-family:'Fredoka One',cursive;font-size:1.6rem;margin-bottom:8px}
.f-vars{font-size:.8rem;color:var(--muted);text-align:left;line-height:1.7}
.n-table{width:100%;border-collapse:collapse;font-size:.82rem;margin:10px 0}
.n-table th{background:var(--text);color:#fff;padding:8px;text-align:left;font-weight:700}
.n-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.n-table tr:nth-child(even) td{background:#fafafa}
.n-ul,.n-ol{font-size:.88rem;line-height:1.7;margin:8px 0 8px 18px}
.n-ul li,.n-ol li{margin-bottom:3px}
.diagram{background:#f8f8f8;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:monospace;font-size:.78rem;line-height:1.6;white-space:pre;overflow-x:auto;margin:10px 0}
.tip-box{background:#f0fff4;border-left:4px solid var(--mint);border-radius:0 8px 8px 0;padding:12px 14px;font-size:.87rem;line-height:1.55;margin:10px 0}
.warn-box{background:#fff5f0;border-left:4px solid var(--peach);border-radius:0 8px 8px 0;padding:12px 14px;font-size:.87rem;line-height:1.55;margin:10px 0}
.links-head{font-family:'Fredoka One',cursive;font-size:.95rem;margin:18px 0 8px}
.link-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-radius:10px;margin-bottom:8px;text-decoration:none;color:var(--text);border:1px solid var(--border);font-size:.85rem;font-weight:600}
.link-item:active{opacity:.7}

/* FIXED BOTTOM BAR */
.bottom-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:12px 16px;background:var(--bg);border-top:1px solid var(--border);z-index:50}

/* BUTTONS */
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#4ECDC4,#2b8fc0);color:#fff}
.btn-success{background:linear-gradient(135deg,var(--mint),#3a9a45);color:#fff}
.btn-sec{background:var(--border);color:var(--text)}

/* QUIZ */
.qz-hdr{padding:10px 16px;display:flex;align-items:center;gap:10px}
.qz-prog{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap}
.qz-q{font-size:1rem;font-weight:700;line-height:1.5;margin-bottom:16px}
.qz-opts{display:flex;flex-direction:column;gap:8px}
.qz-opt{padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:.9rem;cursor:pointer;text-align:left;background:#fff;font-family:'Nunito',sans-serif;font-weight:600;transition:all .15s}
.qz-opt:active{transform:scale(.98)}
.qz-opt.sel{border-color:var(--blue);background:#e8fafa}
.qz-opt.ok{border-color:var(--mint);background:#f0fff4}
.qz-opt.bad{border-color:var(--red);background:#fff0f5}
.qz-explain{background:#fff8e1;border-radius:10px;padding:12px;font-size:.85rem;line-height:1.5;margin-top:12px;display:none}
.btn-next{width:100%;padding:14px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;margin-top:12px;background:var(--blue);color:#fff;display:none}

/* RESULT */
.result-wrap{text-align:center;padding:40px 24px}
.r-emoji{font-size:4rem;margin-bottom:12px}
.r-title{font-family:'Fredoka One',cursive;font-size:2rem;margin-bottom:8px}
.r-pct{font-family:'Fredoka One',cursive;font-size:3.5rem;color:var(--mint);margin:10px 0}
.r-msg{font-size:.95rem;color:var(--muted);margin-bottom:24px}
.r-btns{display:flex;flex-direction:column;gap:10px}
.btn-action{padding:14px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="screen-home" class="screen">
  <div class="hdr">
    <div style="min-width:40px"></div>
    <span class="hdr-title">🔬 Science Revision</span>
    <div class="hdr-right" id="home-badge"></div>
  </div>
  <div class="home-top">
    <div class="home-title">Melly's Science Exam 🐥</div>
    <div class="home-sub">S1B–S1R · Teacher: Kyriakos Solomou</div>
  </div>
  <div class="countdown" id="countdown"></div>
  <div class="card">
    <div style="font-weight:700;font-size:.95rem;margin-bottom:10px">Overall Progress</div>
    <div class="pb-wrap"><div class="pb-fill" id="overall-bar" style="width:0%"></div></div>
    <div class="pb-label" id="overall-label">0 of 18 topics mastered</div>
    <div class="overall-stats">
      <div><div class="stat-num" id="s-mastered">0</div><div class="stat-lbl">Mastered ✅</div></div>
      <div><div class="stat-num" id="s-read">0</div><div class="stat-lbl">Studied 📖</div></div>
      <div><div class="stat-num">18</div><div class="stat-lbl">Total Topics</div></div>
    </div>
  </div>
  <div class="sec-title">Topic Groups</div>
  <div id="groups-list"></div>
</div>

<!-- GROUP -->
<div id="screen-group" class="screen">
  <div class="hdr">
    <button class="back" onclick="goHome()">←</button>
    <span class="hdr-title" id="g-title"></span>
    <div style="min-width:40px"></div>
  </div>
  <div style="padding:10px 16px 0">
    <div class="pb-wrap"><div class="pb-fill" id="g-bar" style="width:0%"></div></div>
    <div class="pb-label" id="g-bar-lbl"></div>
  </div>
  <div class="card" style="padding:8px 16px;margin-top:10px">
    <div id="topics-list"></div>
  </div>
</div>

<!-- TOPIC -->
<div id="screen-topic" class="screen">
  <div class="hdr">
    <button class="back" id="t-back">←</button>
    <span class="hdr-title" id="t-title"></span>
    <div style="min-width:40px"></div>
  </div>
  <div class="steps">
    <div class="step" id="step1">📖 Study Notes</div>
    <div class="step-sep">›</div>
    <div class="step" id="step2">🎯 Test</div>
  </div>
  <div class="notes-wrap">
    <div id="notes-body"></div>
    <div id="notes-links"></div>
  </div>
  <div class="bottom-bar">
    <button class="btn btn-primary" id="quiz-btn" onclick="startQuiz()">🎯 Take the Test</button>
  </div>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
  <div class="hdr">
    <button class="back" id="qz-back">←</button>
    <span class="hdr-title" id="qz-title">Knowledge Test</span>
    <div style="min-width:40px"></div>
  </div>
  <div class="qz-hdr">
    <div class="pb-wrap" style="flex:1"><div class="pb-fill" id="qz-bar" style="width:0%"></div></div>
    <div class="qz-prog" id="qz-prog">1/6</div>
  </div>
  <div style="padding:0 16px 100px" id="qz-body"></div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div class="hdr">
    <div style="min-width:40px"></div>
    <span class="hdr-title">Result</span>
    <div style="min-width:40px"></div>
  </div>
  <div class="result-wrap" id="result-body"></div>
</div>

</div><!-- #app -->

<script>
// ── STATE ────────────────────────────────────────────────────────
const SK = 'melly_sci_v2';
let ST = {};
function loadST(){ try{ ST = JSON.parse(localStorage.getItem(SK)||'{}'); }catch(e){ ST={}; } }
function saveST(){ localStorage.setItem(SK, JSON.stringify(ST)); }
function ts(id){ if(!ST[id]) ST[id]={read:false,passed:false,score:0,max:0}; return ST[id]; }

// ── NAV ──────────────────────────────────────────────────────────
let curGroup = null, curTopic = null;
let qzQs=[], qzIdx=0, qzScore=0, qzDone=false;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  window.scrollTo(0,0);
}

function goHome(){ renderHome(); show('home'); }

// ── COUNTDOWN ────────────────────────────────────────────────────
function renderCountdown(){
  const exam = new Date('2026-05-18T09:00:00');
  const diff = exam - new Date();
  const days = Math.ceil(diff/(1000*60*60*24));
  const el = document.getElementById('countdown');
  if(days>0){
    el.innerHTML=`<div class="cd-days">${days}</div><div class="cd-lbl">days until your Science Exam</div><div class="cd-date">Monday, 18 May 2026</div>`;
  } else if(days===0){
    el.innerHTML=`<div class="cd-days">📝</div><div class="cd-lbl">TODAY is your Science Exam — you've got this!</div>`;
  } else {
    el.innerHTML=`<div class="cd-days">✅</div><div class="cd-lbl">Exam complete! All that revision paid off!</div>`;
  }
}

// ── HOME ─────────────────────────────────────────────────────────
function renderHome(){
  renderCountdown();
  let mastered=0, read=0;
  GROUPS.forEach(g=>g.topics.forEach(t=>{
    const s=ts(t.id);
    if(s.passed) mastered++;
    else if(s.read) read++;
  }));
  const total=18;
  const pct=Math.round(mastered/total*100);
  document.getElementById('overall-bar').style.width=pct+'%';
  document.getElementById('overall-label').textContent=`${mastered} of ${total} topics mastered`;
  document.getElementById('s-mastered').textContent=mastered;
  document.getElementById('s-read').textContent=read;
  document.getElementById('home-badge').textContent=pct+'%';

  const list=document.getElementById('groups-list');
  list.innerHTML='';
  GROUPS.forEach(g=>{
    let gm=0;
    g.topics.forEach(t=>{ if(ts(t.id).passed) gm++; });
    const gp=Math.round(gm/g.topics.length*100);
    const c=document.createElement('div');
    c.className='g-card';
    c.style.background=g.gradient;
    c.innerHTML=`<div class="g-top"><span class="g-icon">${g.icon}</span><div><div class="g-name">${g.name}</div><div class="g-count">${gm}/${g.topics.length} mastered</div></div><span class="g-arrow">›</span></div><div class="pb-wrap"><div class="pb-fill" style="width:${gp}%;background:rgba(255,255,255,.9)"></div></div><div class="pb-label">${gp}% complete</div>`;
    c.onclick=()=>showGroup(g.id);
    list.appendChild(c);
  });
}

// ── GROUP ────────────────────────────────────────────────────────
function showGroup(gid){
  curGroup=gid;
  const g=GROUPS.find(x=>x.id===gid);
  document.getElementById('g-title').textContent=g.icon+' '+g.name;
  let gm=0;
  g.topics.forEach(t=>{ if(ts(t.id).passed) gm++; });
  const gp=Math.round(gm/g.topics.length*100);
  document.getElementById('g-bar').style.width=gp+'%';
  document.getElementById('g-bar-lbl').textContent=`${gm} of ${g.topics.length} topics mastered`;

  const list=document.getElementById('topics-list');
  list.innerHTML='';
  g.topics.forEach(t=>{
    const s=ts(t.id);
    let status,color;
    if(s.passed){status='✅ Mastered';color='#6BCB77';}
    else if(s.read){status='📖 Studied — ready to test!';color='#FF9F6B';}
    else{status='🔒 Not started yet';color='#aaa';}
    const row=document.createElement('div');
    row.className='t-row';
    row.innerHTML=`<span class="t-icon">${t.icon}</span><div class="t-info"><div class="t-name">${t.name}</div><div class="t-status" style="color:${color}">${status}</div></div><span class="t-arr">›</span>`;
    row.onclick=()=>showTopic(t.id);
    list.appendChild(row);
  });
  show('group');
}

// ── TOPIC ────────────────────────────────────────────────────────
function showTopic(tid){
  curTopic=tid;
  let topic=null;
  GROUPS.forEach(g=>g.topics.forEach(t=>{ if(t.id===tid) topic=t; }));
  if(!topic) return;

  document.getElementById('t-title').textContent=topic.icon+' '+topic.name;
  document.getElementById('t-back').onclick=()=>showGroup(curGroup);
  document.getElementById('notes-body').innerHTML=topic.notesHtml;
  document.getElementById('notes-links').innerHTML=
    '<div class="links-head">📚 Further Reading</div>'+
    topic.links.map(l=>`<a class="link-item" href="${l.url}" target="_blank" rel="noopener">🔗 ${l.label}</a>`).join('');

  const s=ts(tid);
  if(!s.read){ s.read=true; saveST(); }
  updateSteps(s);

  const btn=document.getElementById('quiz-btn');
  if(s.passed){
    btn.textContent='✅ Passed! Retake?';
    btn.className='btn btn-success';
  } else {
    btn.textContent='🎯 Take the Test';
    btn.className='btn btn-primary';
  }
  show('topic');
}

function updateSteps(s){
  document.getElementById('step1').className='step'+(s.passed?' done':' active');
  document.getElementById('step2').className='step'+(s.passed?' done':(s.read?' active':''));
}

// ── QUIZ ─────────────────────────────────────────────────────────
function startQuiz(){
  let topic=null;
  GROUPS.forEach(g=>g.topics.forEach(t=>{ if(t.id===curTopic) topic=t; }));
  if(!topic) return;
  qzQs=[...topic.quiz];
  qzIdx=0; qzScore=0; qzDone=false;
  document.getElementById('qz-back').onclick=()=>showTopic(curTopic);
  renderQ();
  show('quiz');
}

function renderQ(){
  const q=qzQs[qzIdx];
  qzDone=false;
  document.getElementById('qz-prog').textContent=`${qzIdx+1}/${qzQs.length}`;
  document.getElementById('qz-bar').style.width=`${(qzIdx/qzQs.length)*100}%`;
  document.getElementById('qz-body').innerHTML=
    `<div class="card"><div class="qz-q">${q.q}</div><div class="qz-opts">`+
    q.opts.map((o,i)=>`<button class="qz-opt" onclick="pick(${i})">${o}</button>`).join('')+
    `</div><div class="qz-explain" id="qz-exp"><strong>💡 Explanation:</strong> ${q.explain}</div>`+
    `<button class="btn-next" id="qz-next" onclick="nextQ()">${qzIdx<qzQs.length-1?'Next →':'See Results 🎉'}</button></div>`;
}

function pick(i){
  if(qzDone) return;
  qzDone=true;
  const q=qzQs[qzIdx];
  document.querySelectorAll('.qz-opt').forEach((b,j)=>{
    b.disabled=true;
    if(j===q.correct) b.classList.add('ok');
    else if(j===i) b.classList.add('bad');
  });
  if(i===q.correct) qzScore++;
  document.getElementById('qz-exp').style.display='block';
  document.getElementById('qz-next').style.display='block';
}

function nextQ(){
  qzIdx++;
  if(qzIdx<qzQs.length){ renderQ(); }
  else { showResult(); }
}

function showResult(){
  const total=qzQs.length;
  const pct=Math.round(qzScore/total*100);
  const passed=pct>=70;
  const s=ts(curTopic);
  s.score=qzScore; s.max=total;
  if(passed) s.passed=true;
  saveST();

  const emoji=pct>=90?'🌟':pct>=70?'🎉':pct>=50?'🤔':'😅';
  const title=pct>=90?'Outstanding!':pct>=70?'Well Done!':pct>=50?'Good Try!':'Keep Practising!';
  const msg=passed?`Topic mastered! Score: ${qzScore}/${total}`:`Need 70% to pass. Score: ${qzScore}/${total}. Review the notes and try again!`;
  const clr=passed?'var(--mint)':'var(--peach)';

  document.getElementById('result-body').innerHTML=
    `<div class="r-emoji">${emoji}</div>`+
    `<div class="r-title">${title}</div>`+
    `<div class="r-pct" style="color:${clr}">${pct}%</div>`+
    `<div class="r-msg">${msg}</div>`+
    `<div class="r-btns">`+
    (!passed?`<button class="btn-action btn-primary" onclick="startQuiz()" style="background:linear-gradient(135deg,#4ECDC4,#2b8fc0);color:#fff">🔄 Try Again</button>`:'')+
    `<button class="btn-action" onclick="showTopic(curTopic)" style="background:var(--border);color:var(--text)">📖 Review Notes</button>`+
    `<button class="btn-action" onclick="showGroup(curGroup)" style="background:var(--border);color:var(--text)">← Back to Topics</button>`+
    `</div>`;
  show('result');
}

// ── DATA (populated below) ────────────────────────────────────────
const GROUPS = [
// ═══════════════════════════════════════════════════════════
// GROUP 1 — FORCES & SPACE
// ═══════════════════════════════════════════════════════════
{
  id:'forces_space', name:'Forces & Space', icon:'🌍',
  gradient:'linear-gradient(135deg,#4ECDC4,#2b8fc0)',
  topics:[
  {
    id:'gravity', name:'Gravity', icon:'⬇️',
    notesHtml:`
<h3 class="n-h3">1. Mass vs Weight</h3>
<p class="n-p"><strong>Mass</strong> is the amount of matter in an object. Measured in <strong>kilograms (kg)</strong>. It never changes, no matter where you are.</p>
<p class="n-p"><strong>Weight</strong> is the gravitational force acting on an object. Measured in <strong>newtons (N)</strong>. It changes depending on where you are.</p>
<table class="n-table"><thead><tr><th>Property</th><th>Mass</th><th>Weight</th></tr></thead>
<tbody><tr><td>What is it?</td><td>Amount of matter</td><td>Gravitational force on an object</td></tr>
<tr><td>Unit</td><td>kilogram (kg)</td><td>newton (N)</td></tr>
<tr><td>Changes with location?</td><td>No — always the same</td><td>Yes — depends on local gravity</td></tr></tbody></table>
<div class="tip-box">💡 Memory trick: Mass = how much <em>stuff</em>. Weight = the <em>pull</em> of gravity on that stuff.</div>

<h3 class="n-h3">2. The Weight Formula</h3>
<div class="formula-box"><div class="f-title">Weight Formula</div><div class="f-eq">W = m × g</div>
<div class="f-vars">W = Weight (Newtons, N)<br>m = Mass (kilograms, kg)<br>g = Gravitational field strength (N/kg)</div></div>
<p class="n-p">On Earth, <strong>g ≈ 9.8 N/kg</strong> (often rounded to 10 N/kg for quick calculations).</p>
<p class="n-p">Example: A 50 kg student on Earth → W = 50 × 9.8 = <strong>490 N</strong></p>
<p class="n-p">Rearranging: to find mass → <strong>m = W ÷ g</strong> &nbsp;|&nbsp; to find g → <strong>g = W ÷ m</strong></p>

<h3 class="n-h3">3. Gravitational Field Strength on Different Worlds</h3>
<table class="n-table"><thead><tr><th>Location</th><th>g (N/kg)</th><th>Weight of 50 kg person</th></tr></thead>
<tbody><tr><td>Earth</td><td>9.8</td><td>490 N</td></tr>
<tr><td>Moon</td><td>1.6</td><td>80 N</td></tr>
<tr><td>Mars</td><td>3.7</td><td>185 N</td></tr>
<tr><td>Jupiter</td><td>24.8</td><td>1240 N</td></tr></tbody></table>

<h3 class="n-h3">4. Gravity as a Non-Contact Force</h3>
<div class="key-box">Gravity is a <strong>non-contact force</strong> — objects do not need to touch for gravity to act between them. The Sun keeps Earth in orbit across 150 million km of empty space.</div>
<ul class="n-ul">
<li>Gravity always <strong>attracts</strong> — it never repels</li>
<li>Gravity acts in <strong>pairs</strong>: Earth pulls you down with the same force you pull Earth up</li>
<li>Greater <strong>mass</strong> → stronger gravitational force</li>
<li>Greater <strong>distance</strong> → weaker gravitational force</li>
<li>Direction: always toward the <strong>centre of mass</strong> of the attracting object</li>
</ul>

<h3 class="n-h3">5. Force Diagrams</h3>
<pre class="diagram">  BOOK ON A TABLE          OBJECT FALLING THROUGH AIR

  ↑ Normal (reaction)        ↑ Air resistance (drag)
  |  force from table        |
[BOOK]                    [OBJECT]
  |                          |
  ↓ Weight (gravity)         ↓ Weight (gravity)

Balanced forces → resultant = 0 → no acceleration
Weight > air resistance → net downward force → object accelerates</pre>
<div class="warn-box">⚠️ Common mistake: "Objects fall because they are heavy." — Actually, ALL objects fall with the same acceleration (ignoring air resistance). A feather and a hammer fall together in a vacuum!</div>`,
    links:[
      {label:'BBC Bitesize — Forces (KS3 Physics)', url:'https://www.bbc.co.uk/bitesize/subjects/zrkw2hv'},
      {label:'PhET — Gravity and Orbits Simulation', url:'https://phet.colorado.edu/en/simulations/gravity-and-orbits'},
      {label:'Khan Academy — Gravity', url:'https://www.khanacademy.org/science/physics/centripetal-force-and-gravitation'}
    ],
    quiz:[
      {q:'What is the unit of <strong>weight</strong>?', opts:['Kilograms (kg)','Metres (m)','Newtons (N)','Watts (W)'], correct:2, explain:'Weight is a force, so it is measured in Newtons (N). Mass is measured in kilograms (kg).'},
      {q:'An object has a mass of 8 kg. What is its weight on Earth? (g = 9.8 N/kg)', opts:['8 N','78.4 N','0.82 N','800 N'], correct:1, explain:'W = m × g = 8 × 9.8 = 78.4 N.'},
      {q:'Which of the following <strong>changes</strong> when you travel from Earth to the Moon?', opts:['Mass','Weight','Both mass and weight','Neither mass nor weight'], correct:1, explain:'Mass never changes — it is the same everywhere. Weight changes because the Moon\'s gravity is weaker (g = 1.6 N/kg vs Earth\'s 9.8 N/kg).'},

      {q:'A book rests on a table and does not move. Which statement is correct?', opts:['Only gravity acts on it','Only the normal force acts on it','Weight and normal force act on it equally — resultant is zero','Gravity is greater than the normal force'], correct:2, explain:'Both weight (downward) and normal/reaction force (upward) act on the book. They are equal in size, so the resultant force is zero and the book does not accelerate.'},
      {q:'Gravity is described as a "non-contact force". What does this mean?', opts:['Gravity only works when objects touch','Gravity only exists in space','Objects do not need to touch for gravity to act between them','Gravity pushes objects apart'], correct:2, explain:'Non-contact means gravity acts across empty space. The Sun pulls Earth gravitationally across 150 million km of vacuum.'}
    ]

    id:'solar_system', name:'Our Solar System', icon:'🪐',
    notesHtml:`
<h3 class="n-h3">1. The Solar System</h3>
<p class="n-p">Our <strong>Solar System</strong> consists of the Sun and all objects held by its gravity: 8 planets, dwarf planets, moons, asteroids, and comets.</p>
<div class="key-box"><strong>Planets in order from the Sun:</strong><br>Mercury · Venus · Earth · Mars · Jupiter · Saturn · Uranus · Neptune<br><br>💡 <em>"<strong>M</strong>y <strong>V</strong>ery <strong>E</strong>nergetic <strong>M</strong>other <strong>J</strong>ust <strong>S</strong>erved <strong>U</strong>s <strong>N</strong>achos"</em></div>

<h3 class="n-h3">2. Types of Objects</h3>
<table class="n-table"><thead><tr><th>Object</th><th>Description</th></tr></thead>
<tbody><tr><td><strong>Dwarf planets</strong></td><td>Smaller than planets; do NOT clear other objects from their orbital path (e.g. Pluto, Eris)</td></tr>
<tr><td><strong>Moons</strong></td><td>Natural satellites orbiting planets. Earth has 1; Jupiter has 90+</td></tr>
<tr><td><strong>Asteroids</strong></td><td>Rocky bodies, mostly in the asteroid belt between Mars and Jupiter</td></tr>
<tr><td><strong>Comets</strong></td><td>Ice, dust and rock. Form a bright tail when near the Sun. Tail ALWAYS points AWAY from the Sun</td></tr></tbody></table>

<h3 class="n-h3">3. Planetary Orbits and Motion</h3>
<ul class="n-ul">
<li>Planets orbit the Sun in <strong>elliptical (oval-shaped)</strong> paths — not perfect circles</li>
<li>Most planets orbit <strong>anticlockwise</strong> (viewed from above Earth's North Pole)</li>
<li>Planets keep moving because <strong>there is no friction</strong> in the vacuum of space</li>
<li>Orbit = forward momentum <em>balanced by</em> the Sun's gravitational pull inward</li>
<li>Planets also <strong>rotate (spin)</strong> on their own axis → causes day and night</li>
</ul>
<div class="warn-box">⚠️ <strong>Venus</strong> rotates in the <em>opposite</em> direction (retrograde). <strong>Uranus</strong> rotates on its side (axis tilted ~98°).</div>

<h3 class="n-h3">4. Temperature and Atmosphere</h3>
<table class="n-table"><thead><tr><th>Planet</th><th>Temperature</th><th>Reason</th></tr></thead>
<tbody><tr><td>Venus</td><td>~465°C (hottest!)</td><td>Thick atmosphere traps heat — extreme greenhouse effect</td></tr>
<tr><td>Earth</td><td>Moderate</td><td>Right distance from Sun; atmosphere moderate greenhouse</td></tr>
<tr><td>Mars</td><td>~−60°C</td><td>Far from Sun; very thin atmosphere</td></tr></tbody></table>
<div class="tip-box">💡 Venus is hotter than Mercury even though Mercury is closer to the Sun — because Venus has a thick CO₂ atmosphere that traps heat. Mercury has almost no atmosphere.</div>`,

      {label:'BBC Bitesize — The Solar System', url:'https://www.bbc.co.uk/bitesize/subjects/zrkw2hv'},
      {label:'PhET — Gravity and Orbits', url:'https://phet.colorado.edu/en/simulations/gravity-and-orbits'}

    quiz:[

      {q:'A comet\'s tail always points:', opts:['Toward the Sun','Away from the Sun','In the direction the comet is travelling','Toward Earth'], correct:1, explain:'The tail is blown by solar wind and radiation pressure — it always points AWAY from the Sun, regardless of which way the comet is moving.'},
      {q:'Why are planets able to keep moving in space without slowing down?', opts:['Rocket engines push them','Space is a vacuum — no friction or air resistance','The Sun pushes them forward','They are made of a special frictionless material'], correct:1, explain:'In the vacuum of space there is no air resistance or friction to slow planets down, so they continue moving indefinitely.'},

  {
    id:'solar_formation', name:'Formation of the Solar System', icon:'💫',
    notesHtml:`
<h3 class="n-h3">1. When and From What?</h3>
<div class="key-box">The Solar System formed approximately <strong>4.6 billion years ago</strong> from a vast cloud of gas and dust called the <strong>solar nebula</strong>.</div>

<h3 class="n-h3">2. Step-by-Step Formation</h3>
<ol class="n-ol">
<li>A huge cloud of gas (mainly hydrogen) and dust existed in space.</li>
<li><strong>Gravity</strong> caused the cloud to collapse inward (possibly triggered by a nearby supernova explosion).</li>
<li>As material fell toward the centre, it heated enormously → formed the <strong>proto-Sun</strong>.</li>
<li>Leftover material formed a spinning, flat <strong>accretion disc</strong> around the proto-Sun.</li>
<li>Particles in the disc collided and stuck together (<strong>accretion</strong>) → grew into <strong>planetesimals</strong> (small proto-planets).</li>
<li>Planetesimals collided and merged → grew into the <strong>planets</strong>.</li>
<li><strong>Nuclear fusion</strong> began in the proto-Sun's core → the Sun ignited as a true star.</li>
<li>The Sun's radiation and solar wind blew away remaining gas and dust → Solar System as we know it.</li>
</ol>

<h3 class="n-h3">3. Why Inner vs Outer Planets Are Different</h3>
<table class="n-table"><thead><tr><th></th><th>Inner Planets (Mercury–Mars)</th><th>Outer Planets (Jupiter–Neptune)</th></tr></thead>
<tbody><tr><td>Type</td><td>Rocky / terrestrial</td><td>Gas giants / ice giants</td></tr>
<tr><td>Why?</td><td>Heat near the Sun vaporised lighter gases (hydrogen, helium), leaving only heavy rocky materials</td><td>Farther from Sun where temperatures were low enough for gases and ices to condense and be captured</td></tr>
<tr><td>Examples</td><td>Earth, Mars</td><td>Jupiter, Saturn, Uranus, Neptune</td></tr></tbody></table>
<div class="tip-box">💡 Think of it like an oven: the closer to the heat, the more lighter stuff burns off, leaving only dense rocky material behind.</div>`,
    links:[
      {label:'NASA — Solar System Formation', url:'https://solarsystem.nasa.gov'},
      {label:'BBC Bitesize — The Universe', url:'https://www.bbc.co.uk/bitesize/subjects/zrkw2hv'}
    ],
    quiz:[
      {q:'Approximately how long ago did the Solar System form?', opts:['460 million years ago','4.6 billion years ago','46 billion years ago','4.6 million years ago'], correct:1, explain:'The Solar System formed approximately 4.6 billion years ago from a collapsing cloud of gas and dust called the solar nebula.'},
      {q:'What was the solar nebula?', opts:['The Sun\'s corona','A vast cloud of gas and dust that collapsed to form the Solar System','The first planet to form','A type of solar flare'], correct:1, explain:'The solar nebula was a vast cloud of gas (mainly hydrogen) and dust. Its gravitational collapse led to the formation of the Solar System.'},
      {q:'What force caused the gas and dust cloud to collapse inward?', opts:['Magnetism','Pressure','Gravity','The Sun\'s radiation'], correct:2, explain:'Gravity pulled the particles in the cloud together. As the cloud collapsed, it heated up and the proto-Sun formed at the centre.'},
      {q:'Why are the inner planets (Mercury–Mars) rocky rather than gas giants?', opts:['Rocky materials are heavier and fell inward','Heat near the Sun vaporised lighter gases, leaving only rocky material','The Sun attracted only rocky material','Gas planets pushed rocky ones inward'], correct:1, explain:'The intense heat near the young Sun vaporised and drove away lighter gases (hydrogen, helium), so only heavier rocky materials remained to form the inner planets.'},
      {q:'What are planetesimals?', opts:['Tiny comets','Small proto-planets formed by accretion that later collided to form full planets','Mini versions of the Sun','Rocks in the asteroid belt'], correct:1, explain:'Planetesimals were small proto-planets built up through accretion (particles sticking together). They collided and merged over millions of years to form the planets.'},
      {q:'What "switched on" the Sun and ignited it as a true star?', opts:['A nearby supernova','Chemical combustion of hydrogen','Nuclear fusion beginning in the core','Collision with a large asteroid'], correct:2, explain:'When the proto-Sun\'s core became hot and dense enough, nuclear fusion of hydrogen atoms began, releasing enormous energy — this is what makes the Sun shine.'}
    ]

  {
    id:'moon_eclipses', name:'The Sun, Earth & Moon', icon:'🌙',
    notesHtml:`
<h3 class="n-h3">1. Key Facts and Sizes</h3>
<ul class="n-ul">
<li>The Sun's diameter is about <strong>109 × Earth's diameter</strong></li>
<li>Earth's diameter is about <strong>3.7 × the Moon's diameter</strong></li>
<li>The Moon orbits Earth in approximately <strong>27.3 days</strong> in an elliptical orbit</li>
<li>The Moon <strong>does not produce its own light</strong> — it reflects sunlight</li>
</ul>

<h3 class="n-h3">2. Moon Phases</h3>
<pre class="diagram">🌑  →  🌒  →  🌓  →  🌔  →  🌕  →  🌖  →  🌗  →  🌘  →  🌑
New   Wax.  1st   Wax.  Full  Wan.  3rd   Wan.  New
      Cres. Qtr   Gib.        Gib.  Qtr   Cres.</pre>
<ul class="n-ul">
<li><strong>Waxing</strong> = visible lit area is growing (New → Full)</li>
<li><strong>Waning</strong> = visible lit area is shrinking (Full → New)</li>
<li><strong>Synchronous rotation (tidal locking)</strong>: The Moon rotates on its axis in exactly the same time it takes to orbit Earth → we always see the <em>same side</em> of the Moon</li>
</ul>

<h3 class="n-h3">3. Solar Eclipses</h3>
<div class="key-box">A solar eclipse occurs when the Moon passes <strong>between the Sun and Earth</strong>, blocking sunlight.<br><br>Order: <strong>Sun → Moon → Earth</strong><br>Only happens during a <strong>New Moon</strong>.</div>
<pre class="diagram">   ☀️ SUN ——→ 🌑 MOON ——→ 🌍 EARTH

   Umbra (central shadow) → Total solar eclipse
   Penumbra (partial shadow) → Partial solar eclipse</pre>

<h3 class="n-h3">4. Lunar Eclipses</h3>
<div class="key-box">A lunar eclipse occurs when <strong>Earth passes between the Sun and Moon</strong>, blocking sunlight from reaching the Moon.<br><br>Order: <strong>Sun → Earth → Moon</strong><br>Only happens during a <strong>Full Moon</strong>.</div>
<p class="n-p">During a lunar eclipse the Moon turns <strong>reddish-orange</strong>: some sunlight bends around Earth's atmosphere and reaches the Moon. Blue light scatters away; red/orange light passes through — the same effect as a sunset.</p>

<h3 class="n-h3">5. Why Not Every Month?</h3>
<div class="warn-box">⚠️ The Moon's orbit is tilted about <strong>5°</strong> relative to Earth's orbit around the Sun. So usually the Moon passes slightly above or below the Sun-Earth line — eclipses only happen when all three align precisely.</div>`,

      {label:'NASA — Moon Phases', url:'https://moon.nasa.gov'},
      {label:'BBC Bitesize — Earth, Sun and Moon', url:'https://www.bbc.co.uk/bitesize/subjects/zrkw2hv'}
    ],
    quiz:[

      {q:'What does "waxing" mean in the context of Moon phases?', opts:['The Moon is getting smaller','The Moon is getting brighter (lit area increasing)','The Moon is hidden','The Moon is at its full phase'], correct:1, explain:'Waxing means the visible lit portion of the Moon is increasing — going from New Moon toward Full Moon.'},
      {q:'During a SOLAR eclipse, what is the correct order from left to right?', opts:['Earth → Moon → Sun','Sun → Earth → Moon','Sun → Moon → Earth','Moon → Sun → Earth'], correct:2, explain:'In a solar eclipse, the Moon passes between the Sun and Earth. Order: Sun → Moon → Earth. This only happens at New Moon.'},
      {q:'During which Moon phase does a LUNAR eclipse occur?', opts:['New Moon','First Quarter','Full Moon','Third Quarter'], correct:2, explain:'A lunar eclipse requires Earth to be between the Sun and Moon. This alignment only occurs during a Full Moon.'},
      {q:'Why does the same side of the Moon always face Earth?', opts:['The Moon does not rotate at all','The Moon\'s rotation and orbital period are exactly the same (tidal locking)','Gravity stops the far side from being seen','The Moon is flat on one side'], correct:1, explain:'Tidal locking (synchronous rotation): the Moon rotates once on its axis in the same time it takes to orbit Earth (27.3 days), so we always see the same hemisphere.'},
      {q:'Why does the Moon appear reddish-orange during a lunar eclipse?', opts:['The Moon gets very hot','Red light from Earth\'s atmosphere bends around and reaches the Moon; blue light scatters away','The shadow of Earth is red','Dust from space colours the Moon'], correct:1, explain:'As sunlight passes through Earth\'s atmosphere, blue light scatters away (like during a sunset) and red/orange light bends around to dimly light the Moon — giving it its "blood moon" appearance.'},
      {q:'True or False: A solar eclipse can happen during a Full Moon.', opts:['TRUE — it can happen any time','FALSE — solar eclipses only happen at New Moon','TRUE — but only in winter','FALSE — solar eclipses never happen'], correct:1, explain:'FALSE. A solar eclipse requires the Moon to be between the Sun and Earth — this only happens at New Moon. At Full Moon, Earth is between the Sun and Moon (which can cause a lunar eclipse instead).'}
    ]

  {
    id:'tides', name:'Tides', icon:'🌊',
    notesHtml:`
<h3 class="n-h3">1. What Causes Tides?</h3>
<p class="n-p">Tides are the regular rise and fall of sea levels caused mainly by the <strong>gravitational pull of the Moon</strong>, and to a lesser extent the Sun.</p>
<div class="key-box">The Moon has a <strong>greater effect</strong> on tides than the Sun, even though the Sun is far more massive. This is because the Moon is <em>much closer</em> to Earth — and distance has a bigger effect on tidal force than mass does.</div>

<h3 class="n-h3">2. Two Tidal Bulges</h3>
<pre class="diagram">             MOON
              ↓
🌊←—[EARTH]—→🌊

Bulge 1: Ocean on the side FACING the Moon → pulled toward Moon
Bulge 2: Ocean on the side AWAY from Moon → Earth pulled toward
         Moon but water "left behind" due to inertia

Because of TWO bulges → most places get TWO high tides per day
Tidal cycle: approximately 12 hours 25 minutes between high tides</pre>

<h3 class="n-h3">3. Spring Tides vs Neap Tides</h3>
<table class="n-table"><thead><tr><th></th><th>Spring Tides</th><th>Neap Tides</th></tr></thead>
<tbody><tr><td><strong>When?</strong></td><td>Sun, Moon and Earth are aligned (in a straight line)</td><td>Sun and Moon are at right angles to each other</td></tr>
<tr><td><strong>Moon phase</strong></td><td>New Moon and Full Moon</td><td>First Quarter and Third Quarter</td></tr>
<tr><td><strong>Tidal range</strong></td><td>LARGER — higher high tides, lower low tides</td><td>SMALLER — more moderate tides</td></tr>
<tr><td><strong>Why?</strong></td><td>Sun and Moon gravity add together</td><td>Sun's gravity partly cancels Moon's</td></tr></tbody></table>
<div class="warn-box">⚠️ "Spring tides" have NOTHING to do with the season "spring"! They happen at New Moon and Full Moon throughout the whole year.</div>`,
    links:[
      {label:'BBC Bitesize — Tides', url:'https://www.bbc.co.uk/bitesize/subjects/zrkw2hv'},
      {label:'NASA — Tides and the Moon', url:'https://solarsystem.nasa.gov'}
    ],
    quiz:[
      {q:'What is the main cause of tides?', opts:['Wind over the ocean','The gravitational pull of the Moon','Earth\'s rotation','Ocean currents'], correct:1, explain:'Tides are mainly caused by the Moon\'s gravitational pull on Earth\'s oceans. The Sun also contributes but has a smaller effect due to its much greater distance.'},
      {q:'Why does the Moon have a GREATER tidal effect than the Sun, even though the Sun is far more massive?', opts:['The Moon is bigger than the Sun','The Moon\'s light is stronger','The Moon is much closer to Earth, and distance has a bigger effect on tidal force than mass','The Moon orbits Earth faster'], correct:2, explain:'Tidal force depends strongly on distance (it decreases with the cube of distance). The Moon is ~150 times closer to Earth than the Sun, which more than compensates for the Sun\'s greater mass.'},
      {q:'How many tidal bulges does Earth have at any given time?', opts:['One — on the side facing the Moon','Two — one facing the Moon and one on the opposite side','Three — one toward Moon, one away, one at the equator','Four — one on each side'], correct:1, explain:'There are always TWO tidal bulges: one on the side of Earth facing the Moon (pulled toward it) and one on the opposite side (where water is "left behind" as Earth is pulled toward the Moon).'},
      {q:'Spring tides occur when:', opts:['It is the spring season (March–May)','The Moon is at its closest to Earth','The Sun, Moon and Earth are aligned in a straight line','The Moon is at a right angle to the Sun'], correct:2, explain:'Spring tides occur when the Sun, Moon and Earth are aligned — at New Moon and Full Moon. Their gravitational pulls combine for a larger tidal range. Nothing to do with the season!'},
      {q:'Neap tides are SMALLER than average. When do they occur?', opts:['At New Moon and Full Moon','When the Sun and Moon are at right angles to Earth','Only in winter','When the Moon is farthest from Earth'], correct:1, explain:'Neap tides occur at First Quarter and Third Quarter Moon, when the Sun and Moon are at right angles relative to Earth. Their gravitational pulls partly cancel each other out, giving a smaller tidal range.'},
      {q:'A coastal town experiences two high tides per day. Why two, not one?', opts:['Earth rotates twice per day','There are two tidal bulges — one on each side of Earth — and Earth rotates through both each day','The Moon pulls water twice per orbit','The Sun and Moon each cause one high tide'], correct:1, explain:'Earth has two tidal bulges (one facing the Moon, one opposite). As Earth rotates once every 24 hours, most coastal locations pass through both bulges — experiencing two high tides each day.'}
    ]
  }
  ]

    id:'metals', name:'Metals', icon:'🔩',
    notesHtml:`
<h3 class="n-h3">1. Physical Properties of Metals</h3>
<table class="n-table"><thead><tr><th>Property</th><th>Meaning</th><th>Example</th></tr></thead>
<tbody><tr><td><strong>Lustrous</strong></td><td>Shiny surface when cut or polished</td><td>Gold jewellery</td></tr>
<tr><td><strong>Malleable</strong></td><td>Can be hammered into shapes without breaking</td><td>Gold beaten into gold leaf</td></tr>
<tr><td><strong>Ductile</strong></td><td>Can be drawn into thin wires</td><td>Copper drawn into electrical wire</td></tr>
<tr><td><strong>Good electrical conductors</strong></td><td>Allow electric current to flow easily</td><td>Copper wires</td></tr>
<tr><td><strong>Good thermal conductors</strong></td><td>Allow heat to pass through easily</td><td>Iron cooking pots</td></tr>
<tr><td><strong>High melting points</strong></td><td>Require high temperatures to melt</td><td>Iron melts at 1538°C</td></tr>
<tr><td><strong>High density</strong></td><td>Heavy for their size</td><td>Lead, iron</td></tr>
<tr><td><strong>Solid at room temperature</strong></td><td>Almost all metals are solid</td><td>Exception: Mercury is liquid!</td></tr></tbody></table>

<h3 class="n-h3">2. Why Metals Conduct Electricity and Heat</h3>
<div class="key-box">Metals have a special atomic structure: their atoms are arranged in a regular <strong>lattice (grid)</strong>, and each atom releases <strong>free electrons</strong>. These electrons can move freely throughout the metal — this "sea of electrons" allows both electric current and heat to flow easily.</div>

<h3 class="n-h3">3. Where Metals Are Found</h3>
<ul class="n-ul">
<li><strong>Native (pure) form</strong>: gold, silver, platinum, copper</li>
<li><strong>Ores</strong> (combined with oxygen, sulfur etc.): most metals must be extracted — iron from haematite, aluminium from bauxite</li>
</ul>

<h3 class="n-h3">4. Uses Based on Properties</h3>
<table class="n-table"><thead><tr><th>Metal</th><th>Key property</th><th>Use</th></tr></thead>
<tbody><tr><td>Copper</td><td>Excellent conductor, ductile</td><td>Electrical wiring</td></tr>
<tr><td>Aluminium</td><td>Low density, corrosion-resistant</td><td>Aircraft bodies, food cans</td></tr>
<tr><td>Tungsten</td><td>Extremely high melting point</td><td>Light bulb filaments</td></tr>
<tr><td>Gold</td><td>Does not corrode, malleable</td><td>Jewellery, electronics contacts</td></tr>
<tr><td>Iron/Steel</td><td>Strong, hard</td><td>Construction, bridges</td></tr></tbody></table>
<div class="warn-box">⚠️ Common mistake: "Metals are always magnetic." — Only SOME metals are magnetic: iron, nickel, and cobalt. Most metals are NOT magnetic.</div>`,

    notesHtml:`
<h3 class="n-h3">1. What Is an Alloy?</h3>
<div class="key-box">An <strong>alloy</strong> is a <strong>mixture of two or more elements, where at least one is a metal</strong>. Alloys are made by melting the elements together and allowing them to cool.</div>
<p class="n-p">Pure metals often have limitations (e.g. pure iron is soft and rusts easily). Mixing elements creates materials with improved properties.</p>

<h3 class="n-h3">2. Why Alloys Are Harder Than Pure Metals</h3>
<pre class="diagram">PURE METAL: all atoms same size → layers slide easily → soft, malleable
◦ ◦ ◦ ◦ ◦
◦ ◦ ◦ ◦ ◦   ← layers can slide over each other
◦ ◦ ◦ ◦ ◦

ALLOY: different-sized atoms disrupt the layers → harder
◦ ◦ ◦ ◦ ◦
◦ ◦ ● ◦ ◦   ← ● = different-sized atom; prevents sliding
◦ ◦ ◦ ◦ ◦</pre>
<p class="n-p">Two types of alloys:</p>
<ul class="n-ul">
<li><strong>Substitutional</strong>: Atoms of similar size replace each other (e.g. Brass: Cu+Zn)</li>
<li><strong>Interstitial</strong>: Smaller atoms fill gaps between larger atoms (e.g. Steel: Fe+C)</li>
</ul>

<h3 class="n-h3">3. Common Alloys</h3>
<table class="n-table"><thead><tr><th>Alloy</th><th>Made From</th><th>Improved Property</th><th>Use</th></tr></thead>
<tbody><tr><td><strong>Steel</strong></td><td>Iron + carbon</td><td>Much harder and stronger than iron</td><td>Construction, cars, tools</td></tr>
<tr><td><strong>Stainless steel</strong></td><td>Iron + chromium + nickel</td><td>Corrosion-resistant (doesn't rust)</td><td>Cutlery, surgical instruments</td></tr>
<tr><td><strong>Brass</strong></td><td>Copper + zinc</td><td>Harder than copper, attractive colour</td><td>Musical instruments, door handles, taps</td></tr>
<tr><td><strong>Bronze</strong></td><td>Copper + tin</td><td>Harder than copper</td><td>Statues, medals, bearings</td></tr>
<tr><td><strong>Solder</strong></td><td>Tin + lead</td><td>Lower melting point</td><td>Joining electrical components</td></tr>
<tr><td><strong>Duralumin</strong></td><td>Aluminium + copper</td><td>Stronger but still lightweight</td><td>Aircraft parts</td></tr></tbody></table>
<div class="warn-box">⚠️ An alloy is NOT simply a mixture of two metals — it must contain at least one metal, but the other element(s) can be non-metals. Steel = iron + carbon (carbon is a non-metal!).</div>`,
    links:[
      {label:'BBC Bitesize — Alloys', url:'https://www.bbc.co.uk/bitesize/subjects/znxtyrd'}
    ],
    quiz:[
      {q:'What is the correct definition of an alloy?', opts:['A pure metal refined to 99.9% purity','A mixture of two or more elements where at least one is a metal','A liquid metal at room temperature','A naturally occurring metallic compound'], correct:1, explain:'An alloy is a mixture of 2 or more elements where at least one must be a metal. The other element(s) can be metals OR non-metals (e.g. carbon in steel is a non-metal).'},
      {q:'Brass is an alloy of:', opts:['Iron and carbon','Copper and zinc','Aluminium and copper','Tin and lead'], correct:1, explain:'Brass is made from copper and zinc. It is harder than pure copper, has an attractive golden colour, and is used for musical instruments, taps, and door handles.'},
      {q:'Steel is an alloy of:', opts:['Iron and zinc','Copper and tin','Iron and carbon','Aluminium and copper'], correct:2, explain:'Steel is made from iron and carbon. The carbon atoms (smaller than iron atoms) fill the gaps in the iron lattice (interstitial alloy), disrupting the layers and making it much harder and stronger than pure iron.'},
      {q:'Why are alloys generally <strong>harder</strong> than the pure metals they are made from?', opts:['They have more electrons','Different-sized atoms disrupt the regular atomic layers, preventing them from sliding over each other','They are heated to higher temperatures','They contain more atoms'], correct:1, explain:'In a pure metal, all atoms are the same size and layers can slide easily (making it soft). When a different-sized atom is added, it disrupts the regular pattern and prevents layer-sliding — making the alloy harder and stronger.'},
      {q:'Which alloy is used for surgical instruments, and why?', opts:['Bronze — because it is cheap','Brass — because it is golden','Stainless steel — because it does not rust/corrode','Duralumin — because it is lightweight'], correct:2, explain:'Stainless steel (iron + chromium + nickel) is used for surgical instruments because it is corrosion-resistant — it does not rust even when exposed to blood and sterilisation processes.'},
      {q:'True or False: An alloy can only be made from two metals — it cannot contain non-metals.', opts:['TRUE — alloys must only contain metals','FALSE — alloys can contain non-metals (e.g. carbon in steel)','TRUE — by definition an alloy is two metals','FALSE — alloys can only contain non-metals'], correct:1, explain:'FALSE. Steel is a classic example: it contains iron (a metal) and carbon (a non-metal). The definition of an alloy is a mixture where AT LEAST ONE element is a metal — other components can be non-metals.'}

    notesHtml:`
<h3 class="n-h3">1. The pH Scale</h3>
<div class="key-box">The <strong>pH scale</strong> runs from 0 to 14 and measures how acidic or alkaline a substance is.<br>
• <strong>0–6</strong> = Acid (lower number = stronger acid)<br>
• <strong>7</strong> = Neutral (pure water)<br>
• <strong>8–14</strong> = Alkali/Base (higher number = stronger alkali)</div>
<table class="n-table"><thead><tr><th>Substance</th><th>pH</th><th>Type</th></tr></thead>
<tbody><tr><td>Battery acid</td><td>~0</td><td>Strong acid</td></tr>
<tr><td>Stomach acid (HCl)</td><td>1–2</td><td>Strong acid</td></tr>
<tr><td>Lemon juice</td><td>~2</td><td>Strong acid</td></tr>
<tr><td>Vinegar (ethanoic acid)</td><td>~3</td><td>Weak acid</td></tr>
<tr><td>Pure water</td><td>7</td><td>Neutral</td></tr>
<tr><td>Baking soda</td><td>~9</td><td>Weak alkali</td></tr>
<tr><td>Bleach</td><td>~13</td><td>Strong alkali</td></tr>
<tr><td>Oven cleaner</td><td>~14</td><td>Strong alkali</td></tr></tbody></table>

<h3 class="n-h3">2. Acids</h3>
<ul class="n-ul">
<li>pH <strong>below 7</strong></li>
<li>Contain <strong>hydrogen ions (H⁺)</strong> — more H⁺ = lower pH = stronger acid</li>
<li>Taste sour (lemon juice, vinegar) — never taste in the lab!</li>
<li>Turn <strong>blue litmus paper RED</strong></li>
<li>React with metals to produce hydrogen gas</li>
<li>React with carbonates to produce CO₂</li>
</ul>
<p class="n-p"><strong>Common acids:</strong> Hydrochloric acid (HCl) — stomach; Sulfuric acid (H₂SO₄) — car batteries; Nitric acid (HNO₃) — fertilisers; Citric acid — lemons; Ethanoic acid — vinegar; Carbonic acid — fizzy drinks</p>

<h3 class="n-h3">3. Bases and Alkalis</h3>
<ul class="n-ul">
<li>A <strong>base</strong> is any substance that can neutralise an acid</li>
<li>An <strong>alkali</strong> is a base that <em>dissolves in water</em></li>
<li>pH <strong>above 7</strong></li>
<li>Contain <strong>hydroxide ions (OH⁻)</strong></li>
<li>Feel soapy or slippery; taste bitter</li>
<li>Turn <strong>red litmus paper BLUE</strong></li>
</ul>
<p class="n-p"><strong>Common alkalis:</strong> Sodium hydroxide (NaOH) — oven cleaner; Ammonia (NH₃) — cleaning products; Calcium hydroxide — limewater, treating soil; Baking soda (NaHCO₃) — antacids; Toothpaste — slightly alkaline</p>

<h3 class="n-h3">4. Indicators</h3>
<table class="n-table"><thead><tr><th>Indicator</th><th>In Acid</th><th>In Neutral</th><th>In Alkali</th><th>Advantage</th></tr></thead>
<tbody><tr><td>Litmus paper</td><td>Turns red</td><td>Purple</td><td>Turns blue</td><td>Simple — tells you acid/alkali</td></tr>
<tr><td>Universal indicator</td><td>Red/orange/yellow</td><td>Green</td><td>Blue/purple</td><td>Gives approximate <strong>pH number</strong> — more informative</td></tr></tbody></table>
<div class="tip-box">💡 Key advantage of universal indicator over litmus: Universal indicator gives you the <em>approximate pH value</em>, not just "it's an acid" or "it's an alkali."</div>`,
    links:[
      {label:'BBC Bitesize — Acids and Alkalis', url:'https://www.bbc.co.uk/bitesize/subjects/znxtyrd'},

      {q:'A substance has a pH of 13. It is best described as:', opts:['A weak acid','A strong acid','A weak alkali','A strong alkali'], correct:3, explain:'pH 13 is high on the alkaline side and is close to the maximum of 14. This makes it a strong alkali. Strong alkalis (pH 12–14) are very corrosive.'},

  {
    id:'acids_everyday', name:'Acids in Everyday Life', icon:'🦷',
    notesHtml:`
<h3 class="n-h3">1. Acids in the Mouth and Teeth</h3>
<ul class="n-ul">
<li>Bacteria in the mouth feed on sugars and produce <strong>acids as a waste product</strong></li>
<li>These acids lower the pH in the mouth</li>
<li>When pH drops <strong>below ~5.5</strong>, the acid begins to dissolve <strong>tooth enamel</strong> → tooth decay (cavities)</li>
<li>Toothpaste is slightly <strong>alkaline</strong> — it neutralises the mouth acids and helps protect enamel</li>
<li>Fluoride in toothpaste strengthens enamel</li>
</ul>

<h3 class="n-h3">2. Acids in the Stomach</h3>
<ul class="n-ul">
<li>The stomach produces <strong>hydrochloric acid (HCl)</strong> at pH 1–2</li>
<li>Functions: helps <strong>digest food</strong> and <strong>kills harmful bacteria</strong> that enter with food</li>
<li>Too much acid → <strong>indigestion</strong></li>
<li><strong>Antacids</strong> are alkaline tablets/liquids taken to neutralise excess stomach acid (e.g. calcium carbonate, magnesium hydroxide)</li>
</ul>

<h3 class="n-h3">3. Acid Rain</h3>
<div class="key-box">Normal rainwater has a pH of about <strong>5.6</strong> — slightly acidic because CO₂ in the air dissolves in water to form carbonic acid. This is natural and harmless.<br><br><strong>Acid rain</strong> has pH below 5.6, caused by air pollutants from burning fossil fuels.</div>
<table class="n-table"><thead><tr><th>Pollutant</th><th>Source</th><th>Forms</th></tr></thead>
<tbody><tr><td>Sulfur dioxide (SO₂)</td><td>Burning coal and oil in power stations</td><td>Sulfuric acid in rain</td></tr>
<tr><td>Nitrogen oxides (NOₓ)</td><td>Vehicle exhausts, power stations</td><td>Nitric acid in rain</td></tr></tbody></table>
<p class="n-p"><strong>Effects of acid rain:</strong></p>
<ul class="n-ul">
<li>Damages and kills trees and plants</li>
<li>Acidifies lakes and rivers → kills fish and aquatic life</li>
<li>Erodes limestone buildings and statues</li>
<li>Damages soil chemistry → reduces ability to support crop growth</li>
</ul>

<h3 class="n-h3">4. Ocean Acidification</h3>
<p class="n-p">The oceans absorb large amounts of CO₂ from the atmosphere. CO₂ + water → carbonic acid → oceans become <strong>more acidic over time</strong>. This threatens coral reefs and shell-forming animals (their calcium carbonate shells dissolve in acid).</p>

<h3 class="n-h3">5. Soil pH and Farming</h3>
<p class="n-p">Most crops grow best in <strong>slightly acidic to neutral soil</strong> (pH 6–7). Farmers add <strong>lime (calcium hydroxide)</strong> to acidic soil to raise the pH and improve crop growth.</p>`,

      {label:'BBC Bitesize — Acids in Everyday Life', url:'https://www.bbc.co.uk/bitesize/subjects/znxtyrd'}
    ],
    quiz:[
      {q:'What acid does the stomach produce, and what is its approximate pH?', opts:['Citric acid, pH ~5','Sulfuric acid, pH ~0','Hydrochloric acid (HCl), pH 1–2','Carbonic acid, pH ~6'], correct:2, explain:'The stomach produces hydrochloric acid (HCl) at pH 1–2. This strong acid helps digest food and kills harmful bacteria that enter with food.'},
      {q:'At what pH does tooth enamel begin to dissolve?', opts:['Below 7','Below 5.5','Below 4','Above 7'], correct:1, explain:'Tooth enamel begins to dissolve when the pH in the mouth drops below about 5.5. Bacteria produce acids from sugars, lowering the pH and causing tooth decay.'},
      {q:'Normal rainwater has a pH of about 5.6. Why is it slightly acidic (not neutral pH 7)?', opts:['It picks up acid from plants','CO₂ in the air dissolves in rainwater to form carbonic acid','It contains sulfuric acid from factories','It absorbs oxygen from the air'], correct:1, explain:'Carbon dioxide (CO₂) naturally present in the atmosphere dissolves in rainwater to form carbonic acid — making normal rain slightly acidic (pH ~5.6). This is natural and not harmful. Acid rain (from industrial pollutants) has a much lower pH.'},
      {q:'What are the two main gases that cause acid rain, and where do they come from?', opts:['CO₂ and O₂ from animal respiration','SO₂ and NOₓ from burning fossil fuels in power stations and vehicles','Methane and ammonia from farming','Water vapour and nitrogen from factories'], correct:1, explain:'Acid rain is caused by sulfur dioxide (SO₂) — from burning coal and oil — and nitrogen oxides (NOₓ) — from vehicle exhausts and power stations. These dissolve in rainwater to form sulfuric acid and nitric acid.'},
      {q:'Why do farmers add <strong>lime (calcium hydroxide)</strong> to their fields?', opts:['To make crops grow faster by adding calcium','To raise the pH of acidic soil to the ideal range for crop growth','To kill weeds','To increase soil moisture'], correct:1, explain:'Lime (calcium hydroxide) is an alkali. Adding it to acidic soil raises the pH toward the neutral range (pH 6–7), which is ideal for most crops. This neutralisation reaction improves soil chemistry and crop yields.'},

      {q:'How does ocean acidification threaten coral reefs?', opts:['Warmer water dissolves coral','More acidic water dissolves the calcium carbonate shells and skeletons of corals and shellfish','CO₂ blocks sunlight reaching coral','Acid rain falls directly on coral reefs'], correct:1, explain:'As oceans absorb CO₂ and become more acidic, the lower pH dissolves calcium carbonate — the material that makes up coral skeletons and the shells of oysters, clams, and other marine animals. This threatens entire reef ecosystems.'}

<h3 class="n-h3">1. Food Chains</h3>
<p class="n-p">A <strong>food chain</strong> shows the transfer of energy from one organism to another through feeding. It always starts with a <strong>producer</strong>. Arrows show the <strong>direction of energy flow</strong> (from what is eaten → to what eats it).</p>
<table class="n-table"><thead><tr><th>Term</th><th>Definition</th><th>Example</th></tr></thead>
<tbody><tr><td><strong>Producer</strong></td><td>Makes its own food by photosynthesis. Always a plant or algae</td><td>Grass, oak tree, algae</td></tr>
<tr><td><strong>Primary consumer</strong></td><td>Eats the producer; always a herbivore</td><td>Grasshopper, rabbit</td></tr>
<tr><td><strong>Secondary consumer</strong></td><td>Eats the primary consumer</td><td>Frog, fox</td></tr>
<tr><td><strong>Tertiary consumer</strong></td><td>Eats the secondary consumer</td><td>Eagle, large predator</td></tr>
<tr><td><strong>Decomposer</strong></td><td>Breaks down dead organisms and returns nutrients to soil</td><td>Bacteria, fungi, worms</td></tr>
<tr><td><strong>Herbivore</strong></td><td>Eats only plants</td><td>Cow, rabbit</td></tr>
<tr><td><strong>Carnivore</strong></td><td>Eats only animals</td><td>Lion, shark</td></tr>
<tr><td><strong>Omnivore</strong></td><td>Eats plants AND animals</td><td>Bear, humans, badger</td></tr></tbody></table>
<pre class="diagram">Example food chain:
Grass → Grasshopper → Frog → Hawk
(producer) (primary) (secondary) (tertiary)

Energy flows in the direction of the arrows →</pre>
<div class="warn-box">⚠️ Common mistake: Arrows in a food chain point from prey to predator (they show ENERGY FLOW, not "who eats what").</div>

<h3 class="n-h3">2. The 10% Energy Rule</h3>
<div class="key-box">Only about <strong>10%</strong> of the energy from one trophic level is transferred to the next.<br>The other <strong>90%</strong> is lost — used by the organism for movement, body heat, growth, reproduction, or lost in waste.</div>
<pre class="diagram">Grass        10,000 J
                ↓ 10%
Grasshopper   1,000 J
                ↓ 10%
Frog            100 J
                ↓ 10%
Hawk             10 J

This is why food chains rarely exceed 4–5 levels — there is not enough
energy left to support more levels.</pre>

<h3 class="n-h3">3. Food Webs</h3>
<p class="n-p">A <strong>food web</strong> is a network of interconnected food chains in an ecosystem. Food webs are more realistic than food chains because most animals eat more than one type of food.</p>
<p class="n-p"><strong>Predicting population changes:</strong></p>
<ul class="n-ul">
<li>If prey decreases → predators may decrease (less food available)</li>
<li>If a predator decreases → its prey may increase (less predation)</li>
<li>Changes ripple through the whole web</li>
</ul>`,
    links:[
      {label:'BBC Bitesize — Food Chains and Webs', url:'https://www.bbc.co.uk/bitesize/subjects/z4882hv'}
    ],
    quiz:[
      {q:'What do arrows in a food chain represent?', opts:['Which organism is stronger','The direction of energy flow (from food to feeder)','Which organism eats which — pointing from predator to prey','The size of each organism'], correct:1, explain:'Arrows in a food chain show the direction of ENERGY FLOW — from the organism being eaten to the organism that eats it. So grass → rabbit → fox means energy flows from grass to rabbit to fox.'},
      {q:'What is a <strong>producer</strong> in a food chain?', opts:['An organism that hunts other animals','A decomposer that breaks down dead matter','An organism that makes its own food through photosynthesis (plant or algae)','The largest animal in the ecosystem'], correct:2, explain:'Producers (plants and algae) make their own food using sunlight through photosynthesis. They are ALWAYS the first organism in a food chain — the original source of energy.'},
      {q:'Only about 10% of energy is transferred from one trophic level to the next. Where does the other 90% go?', opts:['It disappears','It is used by the organism for movement, heat, growth, and is lost in waste','It returns to the soil','It is stored in the producer'], correct:1, explain:'90% of energy at each level is used by the organism itself for movement, maintaining body temperature, growth, and reproduction — or lost in waste. Only 10% is stored in body tissues and passed on when that organism is eaten.'},
      {q:'Grass contains 100,000 J of energy. Using the 10% rule, how much energy does the eagle receive at the end of the chain: Grass → Rabbit → Fox → Eagle?', opts:['10,000 J','1,000 J','100 J','10 J'], correct:2, explain:'Grass (100,000 J) → Rabbit (10,000 J = 10%) → Fox (1,000 J = 10%) → Eagle (100 J = 10%). Three transfers each at 10% gives 100,000 × 0.1 × 0.1 × 0.1 = 100 J.'},
      {q:'In a food web, if the rabbit population suddenly decreases, what would most likely happen to the fox population?', opts:['Increase — because there is less competition','Decrease — because there is less food available','Stay the same','Double immediately'], correct:1, explain:'If rabbits decrease, foxes have less food. Without enough food, fox numbers will also decrease. This is how population changes ripple through a food web.'},

<h3 class="n-h3">1. What Are Microorganisms?</h3>
<p class="n-p">Microorganisms (microbes) are living things too small to see with the naked eye. They are found everywhere: soil, water, air, surfaces, and inside other organisms.</p>
<table class="n-table"><thead><tr><th>Type</th><th>Cell type</th><th>Key features</th><th>Example</th></tr></thead>
<tbody><tr><td><strong>Bacteria</strong></td><td>Prokaryotic (no nucleus)</td><td>Single-celled; reproduce rapidly by binary fission (splitting in two)</td><td>E. coli, Lactobacillus</td></tr>
<tr><td><strong>Fungi</strong></td><td>Eukaryotic (has nucleus)</td><td>Single or multi-celled; reproduce by spores; decompose organic matter</td><td>Yeast, moulds, mushrooms</td></tr>
<tr><td><strong>Viruses</strong></td><td>NOT a cell (acellular)</td><td>Made of DNA/RNA + protein coat; NOT considered living; reproduce only inside host cells</td><td>Influenza, COVID-19, common cold</td></tr>
<tr><td><strong>Protozoa</strong></td><td>Eukaryotic (has nucleus)</td><td>Single-celled; animal-like; often in water</td><td>Amoeba, Plasmodium (malaria)</td></tr></tbody></table>

<h3 class="n-h3">2. Why Viruses Are Different — Not Truly Living</h3>
<div class="key-box">Viruses are NOT considered living organisms because:<br>
• Not made of cells — made of genetic material (DNA or RNA) + a <strong>protein coat (capsid)</strong><br>
• Cannot reproduce independently — must invade a host cell<br>
• Have no metabolism (no respiration, no growth) outside a host<br>
• Do not carry out any life processes on their own</div>

<h3 class="n-h3">3. Viral Life Cycle</h3>
<ol class="n-ol">
<li>Virus <strong>attaches</strong> to a specific host cell (like a lock and key)</li>
<li>Virus <strong>injects its genetic material</strong> into the host cell</li>
<li>The host cell's machinery is <strong>hijacked</strong> to make copies of the virus</li>
<li>New virus particles are <strong>assembled</strong> inside the host cell</li>
<li>Host cell <strong>bursts (lysis)</strong>, releasing hundreds of new viruses</li>
<li>New viruses <strong>infect neighbouring cells</strong> and repeat the cycle</li>
</ol>

<h3 class="n-h3">4. Microorganisms in Food Production</h3>
<table class="n-table"><thead><tr><th>Food</th><th>Microorganism</th><th>What happens</th></tr></thead>
<tbody><tr><td><strong>Cheese</strong></td><td>Bacteria (Lactobacillus)</td><td>Bacteria ferment lactose (milk sugar) → produce lactic acid → milk proteins curdle → forms cheese</td></tr>
<tr><td><strong>Bread</strong></td><td>Yeast (a fungus)</td><td>Yeast ferments sugars in dough → produces CO₂ gas → gas bubbles trapped in dough → dough rises</td></tr>
<tr><td><strong>Yoghurt</strong></td><td>Bacteria</td><td>Bacteria ferment lactose → lactic acid thickens the milk</td></tr></tbody></table>`,

      {q:'What type of cell do bacteria have?', opts:['Eukaryotic (with a true nucleus)','Prokaryotic (no true nucleus)','They have no cells at all','Animal cells with a nucleus'], correct:1, explain:'Bacteria are prokaryotes — their cells lack a true nucleus. Their DNA floats freely in the cytoplasm. All other cells (fungi, protozoa, animal cells, plant cells) are eukaryotic — with a true membrane-bound nucleus.'},

    notesHtml:`
<h3 class="n-h3">1. What Is Food Spoilage?</h3>
<p class="n-p">Food spoilage is when food becomes unsafe or unpleasant to eat due to the activity of <strong>bacteria and fungi (moulds)</strong>. Signs include: bad smell, slimy texture, colour changes, visible mould.</p>

<h3 class="n-h3">2. Factors Affecting Spoilage</h3>
<table class="n-table"><thead><tr><th>Factor</th><th>Effect on spoilage</th></tr></thead>
<tbody><tr><td><strong>High temperature</strong> (room temperature, ~20°C)</td><td>Microbes grow rapidly → food spoils quickly</td></tr>
<tr><td><strong>Cooking</strong> (above ~70°C)</td><td>Kills most microbes → stops spoilage</td></tr>
<tr><td><strong>Refrigerator</strong> (~4°C)</td><td>Slows microbial growth → food lasts longer</td></tr>
<tr><td><strong>Freezer</strong> (below 0°C)</td><td>Stops microbial activity almost completely</td></tr>
<tr><td><strong>Low pH</strong> (acidic, e.g. vinegar)</td><td>Inhibits bacterial growth → pickling preserves food</td></tr>
<tr><td><strong>Low moisture</strong> (dry food)</td><td>Microbes cannot function → dehydrating preserves food</td></tr>
<tr><td><strong>Salt or sugar</strong></td><td>Draws water out of microbial cells by osmosis → kills them</td></tr></tbody></table>

<h3 class="n-h3">3. Pasteur's Swan-Neck Flask Experiment (~1859)</h3>
<div class="key-box"><strong>Background:</strong> People believed in "spontaneous generation" — that microorganisms appeared from nowhere in rotting food.<br><br><strong>Pasteur's hypothesis:</strong> Microorganisms from the air (not spontaneous generation) cause food spoilage.</div>
<pre class="diagram">Flask 1 (OPEN):          Flask 2 (SWAN-NECK):
   ┌───┐                   ┌───┐
   │   │                   │   │S-shaped
   │broth│                 │broth│neck traps
   │ OPEN│ air + microbes  │ ↙  │microbes
   └───┘ enter freely      └───┘
   → CLOUDY (grew)         → CLEAR (no growth)

When swan-neck flask was TILTED so broth touched the
curved neck where dust collected → CLOUDY immediately!</pre>
<p class="n-p"><strong>Conclusion:</strong> Microorganisms come from the air — they cause food spoilage. Spontaneous generation is WRONG.</p>
<table class="n-table"><thead><tr><th>Variable type</th><th>In Pasteur's experiment</th></tr></thead>
<tbody><tr><td><strong>Independent variable (IV)</strong></td><td>Shape of the flask neck (open vs. swan-neck)</td></tr>
<tr><td><strong>Dependent variable (DV)</strong></td><td>Whether the broth became cloudy (whether microbes grew)</td></tr>
<tr><td><strong>Controlled variables (CVs)</strong></td><td>Same broth, same volume, same room temperature, same time left</td></tr></tbody></table>`,
    links:[
      {label:'BBC Bitesize — Microorganisms and Food', url:'https://www.bbc.co.uk/bitesize/subjects/z4882hv'}
